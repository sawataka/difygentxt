<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat with Dify</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* チャット全体 */
.chat-container {
    width: 500px;
    height: 600px;
    background: #1e293b;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
}

/* ヘッダー */
.header {
    padding: 15px;
    border-bottom: 1px solid #334155;
    font-weight: bold;
    text-align: center;
}

/* メッセージエリア */
#chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* 吹き出し */
.message {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.4;
}

/* 自分 */
.user {
    align-self: flex-end;
    background: #3b82f6;
}

/* Bot */
.bot {
    align-self: flex-start;
    background: #334155;
}

/* 入力エリア */
.input-area {
    display: flex;
    padding: 10px;
    border-top: 1px solid #334155;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    outline: none;
}

button {
    margin-left: 10px;
    padding: 10px 16px;
    border: none;
    background: #3b82f6;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #2563eb;
}
</style>

</head>

<body>

<div class="chat-container">

<div class="header">
🤖 Dify Chat
</div>

<div id="chat"></div>

<div class="input-area">
<input type="text" id="message" placeholder="Type your message...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<script src="/static/chat.js"></script>

</body>
</html>
