<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>AI Insight Generator</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

</head>

<body class="bg-gray-400 text-white">

<!-- HERO -->

<div class="relative h-screen overflow-hidden">
    
<video autoplay muted loop class="absolute w-full h-full object-cover">

<source src="/static/video/bg.mp4" type="video/mp4">

</video>

<div class="absolute inset-0 bg-black/60"></div>

<div class="relative z-10 flex flex-col items-center justify-center h-full">

<h1 class="text-5xl font-bold mb-6">
AI Insight Generator
</h1>

<form id="form" class="w-full max-w-xl">

<input
class="w-full p-3 mb-3 text-black rounded"
name="title"
placeholder="タイトル"
/>

<input
class="w-full p-3 mb-3 text-black rounded"
name="organization"
placeholder="組織"
/>

<textarea
class="w-full p-3 mb-3 text-black rounded"
name="question"
placeholder="質問"
required
></textarea>

<button
class="bg-blue-500 hover:bg-blue-600 px-6 py-3 rounded"
type="submit"
>
Generate
</button>

</form>

</div>

</div>

<!-- AI LOADING -->

<div id="loading" class="hidden text-center mt-10">

<lottie-player
src="https://assets10.lottiefiles.com/packages/lf20_jcikwtux.json"
background="transparent"
speed="1"
style="width:200px;margin:auto"
loop
autoplay>
</lottie-player>

<p id="loading-text" class="text-lg mt-3">
AIが質問を分析しています...
</p>

</div>

<!-- RESULT -->

<div id="result" class="max-w-5xl mx-auto mt-20 hidden">

<!-- description -->

<div data-aos="fade-up">

<h2 class="text-3xl mb-4">説明</h2>

<div
id="description"
class="prose prose-invert"
></div>

</div>

<!-- points -->

<div class="mt-12">

<h2 class="text-3xl mb-4">ポイント</h2>

<div
id="points"
class="grid md:grid-cols-3 gap-6"
></div>

</div>

<!-- sns -->

<div class="mt-12" data-aos="fade-up">

<h2 class="text-3xl mb-4">SNS投稿</h2>

<div class="bg-gray-800 p-6 rounded">

<p id="sns"></p>

<button
onclick="copyPost()"
class="mt-4 bg-blue-500 px-4 py-2 rounded"
>
コピー
</button>

</div>

</div>

</div>

<script src="/static/js/app.js"></script>

<script>
AOS.init();
</script>

</body>
</html>
