<!DOCTYPE html>
<html>
<head>

<title>AI Insight Generator</title>

<script src="https://cdn.tailwindcss.com"></script>



</head>

<body class="bg-gray-100">

<div class="max-w-3xl mx-auto mt-10 bg-white p-8 rounded shadow">

<h1 class="text-2xl font-bold mb-6">
AI Insight Generator
</h1>

<form id="form">

<input
class="w-full border p-2 mb-3"
name="title"
placeholder="タイトル"
/>

<input
class="w-full border p-2 mb-3"
name="organization"
placeholder="組織"
/>

<textarea
class="w-full border p-2 mb-3"
name="question"
placeholder="質問"
required
></textarea>

<button
class="bg-blue-500 text-white px-4 py-2 rounded"
type="submit"
>
Generate
</button>

</form>

<div id="loading" class="mt-6 text-gray-500 hidden">
AIが考えています...
</div>

<div id="result" class="mt-8 hidden">

<h2 class="text-xl font-bold">説明</h2>

<div
id="description"
class="prose mt-2"
></div>

<h2 class="text-xl font-bold mt-6">
ポイント
</h2>

<div
id="points"
class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-3"
></div>

<h2 class="text-xl font-bold mt-6">
SNS投稿
</h2>

<div
class="bg-gray-200 p-4 rounded mt-2"
>

<p id="sns"></p>

<button
onclick="copyPost()"
class="mt-2 text-blue-600"
>
コピー
</button>

</div>

</div>

</div>

<script src="/static/js/app.js"></script>

</body>
</html>
